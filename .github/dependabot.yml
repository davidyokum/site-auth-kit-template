# Weekly update PRs for npm packages and the pinned GitHub Actions. Dependabot can't update auth-kit:
# it's installed from a release tarball URL. Bump that by hand (README, "Upgrading auth-kit").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      amplify:
        patterns: ['@aws-amplify/*', 'aws-amplify', 'aws-cdk-lib', 'constructs']
    ignore:
      # Deliberate pins: move these majors by hand, with `npm run check`.
      # TypeScript 7 is the native port (Next's type-check support comes first); ESLint 10 waits for
      # eslint-config-next's plugins; @types/node follows the Node version the site builds on (22).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
