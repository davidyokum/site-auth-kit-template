name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, unit tests, build, production-build checks, auth matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Actions are pinned to commit SHAs (tags noted alongside).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The lockfile pins auth-kit's release tarball by sha512; --ignore-scripts: no dependency
      # runs install scripts in CI.
      - run: npm ci --ignore-scripts

      # CI never touches AWS: a clearly fake amplify_outputs.json (ci/amplify_outputs.placeholder.json).
      - run: npm run outputs:placeholder -- --force

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build

      # The localhost kit is absent from the build (no dev sign-in code, no /api/dev/sign-in route)...
      - run: npx auth-kit check-prod-build

      # ...and the deployed server answers forged requests to the dev route with 404.
      - name: auth-kit check-dev-route against next start
        run: |
          npx next start --hostname 127.0.0.1 --port 3100 > next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
          npx auth-kit check-dev-route --url http://127.0.0.1:3100
          kill %1 || true

      # Every route × every persona, with and without the proxy, against next dev (no AWS).
      - run: npm run test:matrix
